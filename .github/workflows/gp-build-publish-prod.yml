name: Production - Build and Publish Genome Properties React App Image

on:
  workflow_dispatch:

env:
  REGISTRY: dockerhub.ebi.ac.uk
  IMAGE_NAMESPACE: microbiome-informatics/containers
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  prod-build-and-push-react:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to EBI GitLab registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITLAB_CONTAINERS_USERNAME }}
          password: ${{ secrets.GITLAB_CONTAINERS_PASSWORD }}

      - name: Build the React Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/genome-properties-client:${{ env.IMAGE_TAG }} \
            --build-arg VITE_BASENAME=/genomeproperties \
            -f ./Dockerfile .

      - name: Push the React Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/genome-properties-client:${{ env.IMAGE_TAG }}
