server {
    listen 8000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # NodePort is 32122; nginx listens on 8000 inside the pod. Absolute
    # redirects would rewrite the browser to :8000 and fail.
    absolute_redirect off;

    # App is built with VITE_BASENAME=/interpro/genomeproperties/. Dist is
    # copied under that prefix so asset URLs match the public ingress path.
    location = / {
        return 301 /interpro/genomeproperties/;
    }

    location = /genomeproperties {
        return 301 /interpro/genomeproperties/;
    }

    location = /genomeproperties/ {
        return 301 /interpro/genomeproperties/;
    }

    location = /interpro/genomeproperties {
        return 301 /interpro/genomeproperties/;
    }

    location ^~ /interpro/genomeproperties/ {
        try_files $uri $uri/ /interpro/genomeproperties/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
